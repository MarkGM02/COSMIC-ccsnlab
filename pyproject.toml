[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ccsnlab"
version = "1.0.0"
description = "CCSN analysis & plotting toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mark Martinez" }]
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "ipykernel",
  "pyyaml",
  "tables",
  "cosmic-popsynth>=3.7.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/ccsnlab"]

[project.scripts]
cee-rerun = "ccsnlab.cee_rerun.pipeline:main"

[tool.setuptools.package-data]
ccsnlab = ["cee_rerun/*.dat"]
